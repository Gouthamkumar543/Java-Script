<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./RPS.css">
</head>
<body>
    <h1 id="Header">Rock_Paper_Scissors</h1>
    <div id="choice">
        <div id="rock" class="choices">
            <img src="./../../../Images/R_P_S/rock.png" alt="">
        </div>
        <div id="scissors" class="choices">
            <img src="./../../../Images/R_P_S/scissors.png" alt="">
        </div>
        <div id="paper" class="choices">
            <img src="./../../../Images/R_P_S/paper.png" alt="">
        </div>
    </div>
    <div id="score">
        <div class="you">
            <p id="p1">0</p>
            <p class="p3">You</p>
        </div>
        <div class="com">
            <p id="p2">0</p>
            <p class="p3">Computer</p>
        </div>
    </div>
    <div id="mesg">
        <!-- <span id="mesg_container">Play the game and Enjoy!!!</span> -->
        <p id="mesg_container">Play the game and Enjoy!!!</p>
    </div>
    <script src="./RPS.js"></script>
</body>
</html>
